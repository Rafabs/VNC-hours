<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rotas - VNC</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/routes.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="header">
  <button class="file-btn" onclick="window.location.href='index.html'">VOLTAR</button>
  <button id="btnToggleSemaforos" class="file-btn toggle-btn active" title="Ocultar semáforos">🚦</button>
  <button id="btnToggleParadas" class="file-btn toggle-btn active" title="Ocultar paradas">🚏</button>
  <button id="btnToggleSidebar" class="file-btn" title="Mostrar/ocultar pátio">
    <i data-lucide="panel-right"></i>
  </button>
</div>

  <div id="map"></div>

  <!-- Sidebar: pátio (mesma estrutura de antes) -->
  <aside class="side-panels" id="sidePanels">

    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-tab="viagem">
        <i data-lucide="bus" style="width:14px;height:14px"></i>
        EM VIAGEM <span class="badge" id="emViagemCount">0</span>
      </button>
      <button class="sidebar-tab" data-tab="patio">
        <i data-lucide="warehouse" style="width:14px;height:14px"></i>
        PÁTIO <span class="badge" id="patioCount">0</span>
      </button>
      <button class="sidebar-tab" data-tab="reserva">
        <i data-lucide="shield" style="width:14px;height:14px"></i>
        RESERVA <span class="badge" id="reservaCount">0</span>
      </button>
    </div>

    <!-- ABA EM VIAGEM -->
    <div class="sidebar-body" data-body="viagem">
      <div id="emViagemList"></div>
    </div>

<!-- ABA PÁTIO -->
<div class="sidebar-body" data-body="patio" style="display:none">

  <div class="yard-section">
    <div class="yard-section-title">
      <span>Aguardando · 5 Vias</span>
      <span class="badge-mini" id="waiting5Count">0</span>
    </div>
    <div class="yard-grid waiting-5-grid" id="waiting5Grid"></div>
  </div>

  <div class="yard-section">
    <div class="yard-section-title">
      <span>Aguardando · 10 Vias</span>
      <span class="badge-mini" id="waiting10Count">0</span>
    </div>
    <div class="yard-scroll">
      <div class="yard-grid waiting-10-grid" id="waiting10Grid"></div>
    </div>
  </div>

</div>

<!-- ABA RESERVA -->
<div class="sidebar-body" data-body="reserva" style="display:none">

  <div class="reserve-filters" id="reserveFilters"></div>
  <div class="reserve-grid" id="reserveGrid"></div>

  <span id="reserveCount" style="display:none"></span>
  <span id="unavailableCount" style="display:none"></span>

</div>

  </aside>

  <!-- Inputs ocultos -->
  <input type="file" id="jsonInput" accept=".json" hidden />
  <button id="btnCarregarTracado" class="file-btn floating" title="Carregar traçado JSON">
    <i data-lucide="upload"></i>
  </button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/csvLoader.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/vehicleManager.js"></script>
  <script src="js/yardmanager.js"></script>
  <script src="js/SynchronizationManager .js"></script>
  <script src="js/trajectorySimulator.js"></script>
  <script src="js/routes.js"></script>   <!-- último -->
</body>
</html>
